
name: Gerar APK Next IPTV

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar Manifest Android
        run: |
          echo "=== Diretorio do projeto ==="
          pwd
          echo "=== Versao do Flutter ==="
          flutter --version
          echo "=== Manifest Android ==="
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cat android/app/src/main/AndroidManifest.xml
          else
            echo "ERRO: AndroidManifest.xml nao encontrado"
            exit 1
          fi
          echo "=== Verificar embedding v2 ==="
          grep -n 'flutterEmbedding\|FlutterApplication' android/app/src/main/AndroidManifest.xml || true
          echo "=== Arquivos MainActivity ==="
          find android -type f -name '*MainActivity*' -print
          echo "=== Referencias ao embedding antigo ==="
          grep -RInE \
            'io\.flutter\.app|PluginRegistry\.Registrar|FlutterApplication' \
            android lib "$HOME/.pub-cache/hosted/pub.dev" \
            --exclude-dir=.git || true

      - name: Compilar APK
        run: flutter build apk --release -v

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Next-IPTV-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
