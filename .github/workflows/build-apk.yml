
name: Gerar APK Next IPTV

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivos Android ausentes
        run: flutter create --platforms=android --org com.next --project-name next_iptv .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar estrutura Android
        run: |
          echo "=== Arquivos Gradle ==="
          find android -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

          echo "=== Manifest Android ==="
          cat android/app/src/main/AndroidManifest.xml

          echo "=== MainActivity ==="
          find android -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -exec sh -c 'echo "=== $1 ==="; cat "$1"' _ {} \;

          echo "=== Referencias ao embedding antigo ==="
          grep -RInE \
            'io\.flutter\.app|PluginRegistry\.Registrar|FlutterApplication' \
            android lib "$HOME/.pub-cache/hosted/pub.dev" \
            --exclude-dir=.git || true

      - name: Compilar APK
        run: flutter build apk --release -v

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Next-IPTV-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
